# Chromium dentro de NEXO guardaba sus contraseñas en el llavero del sistema.
# Como la sesión remota no tiene quien pregunte, gcr recurría al «prompter del
# sistema», que dibuja en la sesión físicamente activa: el cuadro de contraseña
# aparecía en la pantalla de la computadora, sin explicación y a media faena.
#
# `basic` guarda los secretos cifrados en el perfil del navegador, dentro del
# hogar del usuario nexo, sin llavero ni diálogo.
--password-store=basic
