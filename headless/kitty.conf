# Terminal de la sesión NEXO. No hereda atajos ni preferencias privadas del usuario anfitrión.
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 11.5
adjust_line_height 116%

window_padding_width 14
# Opaca a propósito: ninguna ventana de Windows deja ver la de atrás, y por
# vídeo remoto el fondo translúcido obliga a recodificar la zona cada vez que
# algo cambia detrás de la terminal.
background_opacity 1.0
dynamic_background_opacity yes
confirm_os_window_close 0
# Hyprland aporta el marco y la barra NEXO aporta los controles universales.
hide_window_decorations yes
remember_window_size no
initial_window_width 1200
initial_window_height 760
wayland_titlebar_color #0d0f17

cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Una cabecera visible incluso con una sola pestaña evita que la terminal parezca
# un rectángulo anónimo debajo de la barra de controles del escritorio.
tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_style separator
tab_separator "  │  "
tab_title_template "    {title}  "
active_tab_foreground #eef2f7
active_tab_background #232839
inactive_tab_foreground #8b90a8
inactive_tab_background #141824
tab_bar_background #0d0f17

enable_audio_bell no
visual_bell_duration 0.1
url_style curly
detect_urls yes

# Ctrl+C y Ctrl+V como en la Terminal de Windows: si hay texto seleccionado
# copia, y si no, Ctrl+C sigue interrumpiendo el programa en marcha.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+enter new_window
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

include theme.conf
