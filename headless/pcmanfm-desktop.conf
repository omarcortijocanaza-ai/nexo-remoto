[Desktop]
Wallpaper=/opt/nexo/assets/viego-wallpaper.jpg
# «zoom» llena la pantalla conservando la proporción. «crop» no existe en
# pcmanfm-qt: con un modo desconocido no dibuja imagen y deja el color liso,
# que es justo lo que se vio al instalarlo.
WallpaperMode=zoom
BgColor=#0f131c
FgColor=#ffffff
ShadowColor=#000000
DesktopIconSize=48
ShowHidden=false
SortColumn=name
SortOrder=ascending
SortFolderFirst=true

[System]
Archiver=xarchiver
Terminal=kitty
SuCommand=

[Volume]
AutoRun=false
MountOnStartup=false
MountRemovable=false
CloseOnUnmount=true

[Behavior]
SingleClick=false
ConfirmDelete=true
ConfirmTrash=false
UseTrash=true
