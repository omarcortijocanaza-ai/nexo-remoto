# Nexo · sesión Hyprland independiente
# Esta configuración se instala para el usuario remoto; no modifica la sesión física.

monitor = WAYLAND-1, 1920x1080@60, 0x0, 1

# Cuatro escritorios virtuales permanentes: la barra de tareas los muestra
# siempre, aunque estén vacíos, para que se vean y se puedan usar sin conocer
# ningún atajo, como en la Vista de tareas de Windows.
workspace = 1, persistent:true, default:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true

# Rex Mortis · misma paleta visual de la sesión Letzus.
$sangre = rgb(c41e3a)
$carmesi = rgb(af3752)
$brasa = rgb(e63950)
$espectro = rgb(5cd8f0)
$hielo = rgb(6990aa)
$runa = rgb(7ee8fa)
$corona = rgb(afa7c6)
$violeta = rgb(ab6c9b)
$text = rgb(d6d9e8)
$subtext0 = rgb(8b90a8)
$surface2 = rgb(354962)
$surface1 = rgb(2d354b)
$surface0 = rgb(232839)
$base = rgb(1e202d)
$mantle = rgb(141824)
$crust = rgb(0d0f17)

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LANG,es_MX.UTF-8
env = LC_TIME,es_MX.UTF-8
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
# Los cuadros de zenity —bienvenida, red, «acerca de»— salían en tema claro:
# no bastaba con `gtk-application-prefer-dark-theme`, que muchas aplicaciones
# GTK3 ignoran. Con esto todo el escritorio es oscuro sin excepciones.
env = GTK_THEME,Adwaita:dark
# La sesión arranca desde systemd, sin pasar por ningún perfil de shell, así que
# nadie define estas rutas. rofi encontraba las aplicaciones pero ninguno de sus
# iconos: el menú Inicio salía con los nombres sobre un hueco vacío.
env = XDG_DATA_HOME,/home/nexo/.local/share
env = XDG_DATA_DIRS,/home/nexo/.local/share:/usr/local/share:/usr/share
env = XDG_CONFIG_DIRS,/etc/xdg

input {
    kb_layout = latam
    follow_mouse = 1
}

# Ventanas al estilo de Windows: sin huecos entre ellas ni contra los bordes,
# borde fino, esquinas poco redondeadas y ninguna ventana translúcida. La
# separación con hueco y la transparencia son señas de un escritorio de mosaico;
# quien viene de Windows las lee como que «algo está mal puesto».
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(5cd8f0cc)
    col.inactive_border = rgba(ffffff1f)
    resize_on_border = true
    extend_border_grab_area = 12
    layout = dwindle
    snap {
        enabled = true
        window_gap = 8
        monitor_gap = 0
        border_overlap = false
    }
}

decoration {
    rounding = 8
    rounding_power = 2.0
    # Todo opaco. En Windows ninguna ventana deja ver la de atrás, y con vídeo
    # remoto la transparencia además cuesta ancho de banda: cada cambio detrás
    # de una ventana translúcida vuelve a codificarse.
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_inactive = false
    # El desenfoque queda sólo para las barras, el menú Inicio y los avisos, que
    # es donde Windows 11 también lo usa.
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
        ignore_opacity = true
        noise = 0.010
        contrast = 1.05
        brightness = 0.95
        vibrancy = 0.20
        popups = true
        popups_ignorealpha = 0.4
    }
    shadow {
        enabled = true
        range = 24
        render_power = 3
        offset = 0 4
        color = rgba(00000077)
        color_inactive = rgba(00000044)
    }
}

# Animaciones cortas y sin rebote: abrir, cerrar y cambiar de escritorio se
# parecen a Windows, y cada fotograma de más es un fotograma que viaja por la red.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 0, 0, 1, 1
    bezier = quick, 0.15, 0, 0.1, 1
    animation = global, 1, 4, quick
    animation = border, 1, 4, quick
    animation = windows, 1, 3.5, quick, popin 94%
    animation = windowsIn, 1, 3.5, quick, popin 94%
    animation = windowsOut, 1, 2.5, quick, popin 94%
    animation = fade, 1, 2.5, quick
    animation = workspaces, 1, 3, quick, slide
    animation = specialWorkspace, 1, 3, quick, slidevert
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 0
    render_unfocused_fps = 20
    # Un clic en la barra de tareas pide activar la ventana; sin esto la
    # petición se anota pero el foco no se mueve, y una aplicación minimizada
    # parece no responder al primer clic.
    focus_on_activate = true
}

cursor {
    no_hardware_cursors = true
    inactive_timeout = 5
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    force_split = 2
}

# Todo se abre como ventana suelta, centrada y superponible, como en Windows.
# En mosaico automático, abrir una segunda aplicación partía la pantalla en dos
# y movía la primera de sitio: es lo que más desconcierta a quien no lo espera.
windowrule = float true, match:class ^(.*)$
windowrule = center true, match:class ^(.*)$
windowrule = float true, match:class ^(pavucontrol|nm-connection-editor|nwg-look|qt5ct|qt6ct)$
windowrule = float true, match:class ^(Rofi|rofi)$
windowrule = stay_focused true, match:class ^(Rofi|rofi)$
windowrule = border_size 0, match:class ^(Rofi|rofi)$
windowrule = center true, match:class ^(Rofi|rofi)$
# El menú Inicio ya no es una ventana: rofi se dibuja como capa y su propio
# tema lo coloca encima de la barra de tareas (`location: south`), así que aquí
# no hace falta ninguna regla de posición.
windowrule = float true, match:class ^(zenity|org.gnome.Zenity|swappy)$
windowrule = center true, match:class ^(zenity|org.gnome.Zenity|swappy)$
windowrule = center true, match:class ^(pavucontrol|nwg-look|qt5ct|qt6ct)$
windowrule = size 1540 900, match:class ^(firefox|org.kde.dolphin|kitty)$
windowrule = size 1100 720, match:class ^(swappy|imv|eog|loupe)$
# Una ventana a pantalla completa no lleva sombra ni esquinas: ocupa todo, como
# una ventana maximizada de Windows.
windowrule = rounding 0, match:fullscreen true
windowrule = border_size 0, match:fullscreen true
layerrule = blur true, match:namespace ^(waybar|rofi|swaync-control-center|swaync-notification-window)$
layerrule = ignore_alpha 0.3, match:namespace ^(waybar|rofi|swaync-control-center|swaync-notification-window)$

# El agente hereda WAYLAND_DISPLAY y HYPRLAND_INSTANCE_SIGNATURE de esta instancia.
exec-once = /usr/local/lib/nexo/session-agent
exec-once = awww-daemon --format xrgb
# El fondo es el que la persona haya elegido en Configuración rápida, o el de
# NEXO si no ha cambiado ninguno. Se aplica dos veces porque la primera puede
# caer sobre una geometría provisional de WAYLAND-1 y saldría escalado contra
# el tamaño equivocado.
exec-once = sleep 1 && /usr/local/lib/nexo/windows-wallpaper apply
exec-once = sleep 6 && /usr/local/lib/nexo/windows-wallpaper apply --settle
# Iconos del Escritorio, si el equipo tiene pcmanfm-qt. Arranca después del
# fondo para que su capa se dimensione contra la salida ya definitiva.
exec-once = sleep 7 && /usr/local/lib/nexo/windows-desktop-icons
exec-once = waybar -c /etc/nexo/waybar.jsonc -s /etc/nexo/windows-waybar.css
exec-once = waybar -c /etc/nexo/window-titlebar.jsonc -s /etc/nexo/windows-waybar.css
exec-once = swaync
# Historial del portapapeles (Windows+V). Sin este vigilante, cliphist no
# guarda nada y el menú aparecería siempre vacío.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = sleep 3 && /usr/local/lib/nexo/windows-welcome

# --- Abrir cosas ------------------------------------------------------------
bind = SUPER, E, exec, dolphin
bind = SUPER, B, exec, firefox
bind = SUPER, Q, exec, /usr/local/lib/nexo/windows-start-menu
bind = SUPER, S, exec, /usr/local/lib/nexo/windows-start-menu
bind = SUPER, SPACE, exec, /usr/local/lib/nexo/windows-start-menu
bindr = SUPER, SUPER_L, exec, /usr/local/lib/nexo/windows-start-menu
bind = SUPER, R, exec, /usr/local/lib/nexo/windows-run-dialog
bind = SUPER, TAB, exec, /usr/local/lib/nexo/windows-task-view
bind = CTRL ALT, T, exec, kitty
# Windows+número abre lo anclado en la barra, en el mismo orden que se ve.
bind = SUPER, 1, exec, dolphin
bind = SUPER, 2, exec, firefox
bind = SUPER, 3, exec, kitty

# --- Configuración, portapapeles y capturas ---------------------------------
bind = SUPER, I, exec, /usr/local/lib/nexo/windows-quick-settings
bind = SUPER, N, exec, swaync-client -t -sw
bind = SUPER, V, exec, /usr/local/lib/nexo/windows-clipboard
bind = SUPER SHIFT, S, exec, /usr/local/lib/nexo/windows-screenshot region
bind = , Print, exec, /usr/local/lib/nexo/windows-screenshot full
bind = ALT, Print, exec, /usr/local/lib/nexo/windows-screenshot window
bind = SUPER, slash, exec, /usr/local/lib/nexo/windows-shortcuts
bind = SUPER, D, exec, /usr/local/lib/nexo/windows-show-desktop
bind = SUPER, M, exec, /usr/local/lib/nexo/windows-show-desktop

# --- Ventanas ---------------------------------------------------------------
bind = SUPER, C, exec, /usr/local/lib/nexo/windows-window-action close
bind = ALT, F4, exec, /usr/local/lib/nexo/windows-window-action close
bind = ALT, F9, exec, /usr/local/lib/nexo/windows-window-action minimize
bind = ALT, SPACE, exec, /usr/local/lib/nexo/windows-window-menu
bind = ALT, TAB, cyclenext
bind = ALT, TAB, bringactivetotop
bind = ALT SHIFT, TAB, cyclenext, prev
bind = ALT SHIFT, TAB, bringactivetotop
bind = SUPER, UP, exec, /usr/local/lib/nexo/windows-window-action maximize
bind = SUPER, DOWN, exec, /usr/local/lib/nexo/windows-window-action restore
bind = SUPER, LEFT, exec, /usr/local/lib/nexo/windows-window-action snap-left
bind = SUPER, RIGHT, exec, /usr/local/lib/nexo/windows-window-action snap-right
bind = SUPER SHIFT, UP, exec, /usr/local/lib/nexo/windows-window-action snap-top
bind = SUPER SHIFT, DOWN, exec, /usr/local/lib/nexo/windows-window-action snap-bottom
bind = SUPER SHIFT, LEFT, exec, /usr/local/lib/nexo/windows-window-action snap-top-left
bind = SUPER SHIFT, RIGHT, exec, /usr/local/lib/nexo/windows-window-action snap-top-right
bind = SUPER, HOME, exec, /usr/local/lib/nexo/windows-window-action center
bind = SUPER, T, exec, /usr/local/lib/nexo/windows-window-action pin
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
# Clic derecho sobre el fondo: menú del escritorio. `bindn` no consume el
# evento, así que el clic derecho dentro de una aplicación sigue llegándole
# igual; el script comprueba dónde cayó y se aparta si no fue en el fondo.
bindn = , mouse:273, exec, /usr/local/lib/nexo/windows-desktop-menu

# --- Escritorios virtuales --------------------------------------------------
bind = SUPER CTRL, LEFT, workspace, r-1
bind = SUPER CTRL, RIGHT, workspace, r+1
bind = SUPER CTRL, D, exec, /usr/local/lib/nexo/windows-desktops
bind = SUPER CTRL SHIFT, LEFT, movetoworkspace, r-1
bind = SUPER CTRL SHIFT, RIGHT, movetoworkspace, r+1

# --- Teclas multimedia del cliente remoto -----------------------------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
