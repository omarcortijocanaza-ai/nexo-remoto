<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Pizarra táctil</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui;background:#dde3ec}.bar{height:64px;display:flex;align-items:center;gap:12px;padding:8px 18px;background:#172033;color:white;box-shadow:0 2px 12px #0004}.bar strong{font-size:20px;margin-right:auto}button,.size{height:44px;border:0;border-radius:12px;padding:0 16px;background:#34415a;color:#fff;font-size:15px;font-weight:650}button.active{outline:3px solid #77a7ff;background:#4b6085}.color{width:38px;height:38px;padding:0;border-radius:50%;border:3px solid #fff6}.size{display:flex;align-items:center;gap:8px}input[type=range]{width:110px}canvas{display:block;background:white;touch-action:none;cursor:crosshair}</style></head>
<body><div class="bar"><strong>✎ Pizarra táctil</strong><button id="pen" class="active">Lápiz</button><button id="eraser">Borrador</button><button class="color" data-color="#111827" style="background:#111827"></button><button class="color" data-color="#e11d48" style="background:#e11d48"></button><button class="color" data-color="#2563eb" style="background:#2563eb"></button><button class="color" data-color="#16a34a" style="background:#16a34a"></button><label class="size">Grosor <input id="size" type="range" min="2" max="40" value="6"></label><button id="clear">Limpiar</button></div><canvas id="board"></canvas>
<script>const c=document.querySelector('#board'),x=c.getContext('2d'),bar=document.querySelector('.bar');let drawing=false,color='#111827',eraser=false,last;function resize(){const old=document.createElement('canvas');old.width=c.width;old.height=c.height;old.getContext('2d').drawImage(c,0,0);c.width=innerWidth;c.height=innerHeight-bar.offsetHeight;x.drawImage(old,0,0)}resize();addEventListener('resize',resize);function p(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{drawing=true;last=p(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drawing)return;const now=p(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(now.x,now.y);x.strokeStyle=eraser?'white':color;x.lineWidth=eraser?35:+document.querySelector('#size').value;x.lineCap='round';x.lineJoin='round';x.stroke();last=now};c.onpointerup=c.onpointercancel=()=>drawing=false;document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{color=b.dataset.color;eraser=false;active('pen')});function active(id){document.querySelectorAll('.bar button').forEach(b=>b.classList.remove('active'));document.querySelector('#'+id).classList.add('active')}document.querySelector('#pen').onclick=()=>{eraser=false;active('pen')};document.querySelector('#eraser').onclick=()=>{eraser=true;active('eraser')};document.querySelector('#clear').onclick=()=>{if(confirm('¿Limpiar toda la pizarra?'))x.clearRect(0,0,c.width,c.height)};</script></body></html>
